[project]
name = "career-compass"
version = "0.1.0"
description = "AI-powered career assistant"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "pydantic",
    "python-multipart",
    "python-dotenv",
    "pypdf",
    "python-docx",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

dependencies = [
    ...
    "openai>=1.40.0",
]